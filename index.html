<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forum</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/xlogin"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#ec4899">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="dot dot-active"></span>
      <span><strong id="stat-messages-top">0</strong> messages</span>
      <span class="sep">·</span>
      <span><strong id="stat-new-members">0</strong> new members</span>
      <span class="sep">·</span>
      <span><strong id="stat-active-channels">0</strong> active channels</span>
      <span class="topbar-id" id="topbar-id" hidden></span>
    </div>
  </header>

  <main>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-icon">💬</div>
        <div class="stat-num" id="stat-messages">0</div>
        <div class="stat-label">Messages</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-num" id="stat-members">0</div>
        <div class="stat-label">Members</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">#</div>
        <div class="stat-num" id="stat-channels">0</div>
        <div class="stat-label">Channels</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-online">●</div>
        <div class="stat-num" id="stat-online">0</div>
        <div class="stat-label">Online</div>
      </div>
    </section>

    <!-- channel list view -->
    <section id="view-channels">
      <div class="toolbar">
        <div class="filters">
          <button class="filter-chip filter-chip-active">All</button>
          <button class="filter-chip" id="btn-new-channel" hidden>+ new channel</button>
        </div>
        <a class="mark-read" href="#" id="mark-read">✓ Mark all read</a>
      </div>
      <div id="channels" class="channels">
        <div class="empty" id="channels-empty">Loading channels…</div>
      </div>
    </section>

    <!-- channel detail view -->
    <section id="view-channel" hidden>
      <div class="channel-header">
        <a class="back" href="#/">← back</a>
        <h2 id="channel-title">#</h2>
        <span class="tag tag-neutral" id="channel-tag" hidden></span>
      </div>
      <p class="channel-header-desc" id="channel-description"></p>

      <div id="posts" class="posts">
        <div class="empty" id="posts-empty">Loading…</div>
      </div>

      <form class="composer" id="composer" hidden>
        <textarea id="composer-text" placeholder="Write a post…" rows="3" required></textarea>
        <div class="composer-actions">
          <span class="composer-hint" id="composer-hint"></span>
          <button type="submit" class="btn-primary">Post</button>
        </div>
      </form>
      <div class="composer-locked" id="composer-locked" hidden>
        Log in (bottom-right) to post.
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
